# Source of truth for HouseholdHelper.xcodeproj: edit this, then `xcodegen generate` in apps/ios
# (scripts/dev/ios.sh gen). The generated project is committed so Xcode and Xcode Cloud open it directly.
name: HouseholdHelper
options:
  bundleIdPrefix: com.householdhelper
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  DebugFirebase: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  DebugFirebase: Config/DebugFirebase.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "13.0.0"

targets:
  HouseholdHelper:
    type: application
    platform: iOS
    sources:
      - path: HouseholdHelper
        excludes: ["GoogleService-Info.plist"]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
    info:
      path: HouseholdHelper/Info.plist
      properties:
        CFBundleDisplayName: Household Helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        FirebaseAppDelegateProxyEnabled: false
        HHApiBaseURL: $(HH_API_BASE_URL)
        HHAuthEmulatorHost: $(HH_AUTH_EMULATOR_HOST)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.householdhelper.app
            CFBundleURLSchemes: [householdhelper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.householdhelper.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  HouseholdHelperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HouseholdHelperTests
      # The API's golden fixtures are the contract; both clients decode the same files.
      - path: ../api/internal/httpapi/testdata/golden
        type: folder
        buildPhase: resources
    dependencies:
      - target: HouseholdHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.householdhelper.app.tests
        GENERATE_INFOPLIST_FILE: YES

  HouseholdHelperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HouseholdHelperUITests
    dependencies:
      - target: HouseholdHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.householdhelper.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HouseholdHelper
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated   # XCTestCase overrides must stay nonisolated

schemes:
  HouseholdHelper:
    build:
      targets:
        HouseholdHelper: all
        HouseholdHelperTests: [test]
        HouseholdHelperUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [HouseholdHelperTests, HouseholdHelperUITests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  HouseholdHelper Firebase:
    build:
      targets:
        HouseholdHelper: all
    run:
      config: DebugFirebase
    archive:
      config: Release
